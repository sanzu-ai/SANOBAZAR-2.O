<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanobazar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <h1>Welcome to Sanobazar !</h1>

        <!-- ===== NAVBAR ===== -->
        <nav>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>

            <!-- ===== SEARCH FORM ===== -->
            <form id="search-form">
                <input type="search" id="search-input" name="q" placeholder="Search products...">
                <button type="submit">Search</button>
            </form>
        </nav>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <section>
            <h2>Our Products</h2>
            
            <!-- Products Grid -->
            <div id="product-list"></div>

            <!-- ===== CART SECTION (Step 12) ===== -->
            <div class="cart-section">
                <h2>Your Shopping Cart</h2>
                <div id="cart-list">
                    <p class="empty-cart-msg">Your cart is empty.</p>
                </div>
                <h3 id="cart-total">Total: NPR 0</h3>
                <button id="checkout-btn" onclick="placeOrder()" style="display: none; width: 100%; margin-top: 15px; background-color: #27ae60;">
                    Proceed to Checkout 🛒
                </button>
            </div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 SANOBAZAR. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
