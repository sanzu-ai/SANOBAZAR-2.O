<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SANOBAZAR</title>
    <!-- Version query parameter ?v=2 forces browser to reload fresh CSS -->
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <!-- Sidebar -->
        <nav class="admin-sidebar">
            <div class="admin-logo">SANOBAZAR <span>Admin</span></div>
            <ul>
    <li><a href="admin.html" class="active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
    <li><a href="analytics.html"><i class="fas fa-chart-pie"></i> Sales Analytics</a></li>
    <li><a href="index.html"><i class="fas fa-store"></i> View Shop</a></li>
    <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
</ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Dashboard Overview</h1>
                <div id="admin-info"></div>
            </header>

            <!-- Stat Cards -->
            <div class="stats-grid" id="stats-container">
                <!-- Stats injected by JS -->
            </div>

            <!-- Management Section -->
            <div class="admin-content-grid">
                <!-- Add Product Form -->
                <div class="admin-card">
                    <h3><i class="fas fa-plus-circle"></i> Add New Product</h3>
                    <form id="add-product-form" class="admin-form">
                        <input type="text" id="p-name" placeholder="Product Name" required>
                        <input type="number" id="p-price" placeholder="Price (Rs.)" required>
                        <input type="number" id="p-stock" placeholder="Stock Quantity" required>
                        <select id="p-category" required>
                            <option value="1">Electronics</option>
                            <option value="2">Fashion</option>
                            <option value="3">Groceries</option>
                        </select>
                        <input type="text" id="p-image" placeholder="Image URL (e.g., https://via.placeholder.com/200)" required>
                        <button type="submit" class="btn-primary">Add Product</button>
                    </form>
                </div>

                <!-- Low Stock Alert -->
                <div class="admin-card">
                    <h3><i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i> Low Stock Alerts (&lt; 5)</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Stock</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="low-stock-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="admin-card mt-2">
                <h3><i class="fas fa-shopping-bag"></i> Recent Orders</h3>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="recent-orders-list"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Check if admin is logged in
        const user = JSON.parse(localStorage.getItem('sanobazar_user'));
        if(!user || user.role !== 'admin') {
            window.location.href = 'login.html';
        }
        document.getElementById('admin-info').innerText = `Welcome, ${user.full_name}`;

        async function loadAdminData() {
            try {
                const resp = await fetch('http://localhost/SANOBAZAR/backend/get_admin_stats.php');
                const data = await resp.json();

                // Render Stats
                document.getElementById('stats-container').innerHTML = `
                    <div class="stat-card"><h4>Total Revenue</h4><p>Rs. ${data.stats.total_revenue || 0}</p></div>
                    <div class="stat-card"><h4>Total Orders</h4><p>${data.stats.total_orders}</p></div>
                    <div class="stat-card"><h4>Customers</h4><p>${data.stats.total_users}</p></div>
                    <div class="stat-card" style="border-left: 5px solid #ef4444;"><h4>Low Stock</h4><p>${data.stats.low_stock_count}</p></div>
                `;

                // Render Low Stock
                const lowStockHTML = data.low_stock_items.map(item => `
                    <tr>
                        <td>${item.name}</td>
                        <td class="text-danger"><b>${item.stock_quantity}</b></td>
                        <td><button onclick="alert('Restock feature coming soon')" class="btn-sm">Restock</button></td>
                    </tr>
                `).join('');
                document.getElementById('low-stock-list').innerHTML = lowStockHTML || '<tr><td colspan="3">All items are well stocked!</td></tr>';

                // Render Recent Orders
                const ordersHTML = data.recent_orders.map(order => `
                    <tr>
                        <td>#${order.id}</td>
                        <td>Rs. ${order.total_amount}</td>
                        <td><span class="badge">${order.order_status}</span></td>
                        <td>${new Date(order.created_at).toLocaleDateString()}</td>
                    </tr>
                `).join('');
                document.getElementById('recent-orders-list').innerHTML = ordersHTML || '<tr><td colspan="4">No orders placed yet.</td></tr>';
            } catch (err) {
                console.error("Error loading admin stats:", err);
            }
        }

        // Handle Add Product
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const productData = {
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                stock_quantity: document.getElementById('p-stock').value,
                category_id: document.getElementById('p-category').value,
                image_url: document.getElementById('p-image').value
            };

            const resp = await fetch('http://localhost/SANOBAZAR/backend/admin_products.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });
            const result = await resp.json();
            alert(result.message || result.error);
            location.reload();
        });

        function logout() {
            localStorage.removeItem('sanobazar_user');
            window.location.href = 'login.html';
        }

        loadAdminData();
    </script>
</body>
</html>
