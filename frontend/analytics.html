<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics - SANOBAZAR</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <!-- Sidebar (same as admin.html) -->
        <nav class="admin-sidebar">
            <div class="admin-logo">SANOBAZAR <span>Admin</span></div>
            <ul>
                <li><a href="admin.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="analytics.html" class="active"><i class="fas fa-chart-pie"></i> Sales Analytics</a></li>
                <li><a href="index.html"><i class="fas fa-store"></i> View Shop</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Sales Analytics &amp; Revenue Reports</h1>
                <div id="admin-info"></div>
            </header>

            <!-- Stat Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Total Revenue</h4>
                    <p id="stat-revenue">Rs. 0.00</p>
                </div>
                <div class="stat-card">
                    <h4>Total Orders</h4>
                    <p id="stat-orders">0</p>
                </div>
                <div class="stat-card">
                    <h4>Average Order Value</h4>
                    <p id="stat-aov">Rs. 0.00</p>
                </div>
            </div>

            <!-- Category Sales Table -->
            <div class="admin-card">
                <h3><i class="fas fa-layer-group"></i> Sales Performance by Category</h3>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Category Name</th>
                            <th>Items Sold</th>
                            <th>Total Category Revenue</th>
                        </tr>
                    </thead>
                    <tbody id="category-sales-body">
                        <tr><td colspan="3">Loading analytics...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Security check: only admins can view this page
        const savedUser = localStorage.getItem("sanobazar_user");
        if (!savedUser) {
            window.location.href = "login.html";
        }
        const user = JSON.parse(savedUser);
        if (user && user.role !== "admin") {
            window.location.href = "index.html";
        }
        if (user) {
            document.getElementById("admin-info").textContent = `Welcome, ${user.full_name}`;
        }

        function loadAnalytics() {
            fetch("http://localhost/SANOBAZAR/backend/get_analytics.php")
                .then(res => res.json())
                .then(data => {
                    if (data.status !== "success") return;

                    const stats = data.data;
                    document.getElementById("stat-revenue").textContent = "Rs. " + Number(stats.total_revenue).toFixed(2);
                    document.getElementById("stat-orders").textContent = stats.total_orders;
                    document.getElementById("stat-aov").textContent = "Rs. " + Number(stats.avg_order_value).toFixed(2);

                    const rows = stats.category_sales.map(cat => `
                        <tr>
                            <td><strong>${cat.category_name}</strong></td>
                            <td>${cat.items_sold} units</td>
                            <td class="text-success">Rs. ${Number(cat.category_revenue).toFixed(2)}</td>
                        </tr>
                    `).join("");

                    document.getElementById("category-sales-body").innerHTML =
                        rows || '<tr><td colspan="3">No sales data yet.</td></tr>';
                })
                .catch(err => console.error("Error loading analytics:", err));
        }

        function logout() {
            localStorage.removeItem("sanobazar_user");
            window.location.href = "login.html";
        }

        loadAnalytics();
    </script>
</body>
</html>
